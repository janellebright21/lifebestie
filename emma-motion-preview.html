<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emma Motion Preview</title><style>body{margin:0;background:#f6f0fa;color:#35233e;font:16px system-ui}main{max-width:960px;margin:auto;padding:24px}h1{margin:0 0 8px}p{line-height:1.5}model-viewer{width:100%;height:65vh;min-height:350px;background:#eee4f5;border-radius:24px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}button,.pick{background:#7955a2;color:white;padding:12px 18px;border:0;border-radius:16px;cursor:pointer;font:inherit}button:disabled{opacity:.4;cursor:default}input{max-width:100%}#status{min-height:24px}small{color:#65536e}</style><main><h1>Meet Emma in motion</h1><p>Load <strong>Emma-Gentle-Idle-and-Wave.glb</strong>, then try her idle and wave. Drag to see another angle; scroll or pinch to zoom.</p><label class="pick">Choose Emma GLB <input id="file" type="file" accept=".glb,model/gltf-binary"></label><p id="status" role="status">Choose the downloaded model to begin.</p><model-viewer id="emma" alt="Emma's animated 3D model" camera-controls shadow-intensity="1" animation-crossfade-duration="550" exposure="1" interaction-prompt="none"></model-viewer><nav><button id="idle" disabled>Gentle idle</button><button id="wave" disabled>Wave hello</button><button id="pause" disabled>Pause</button><button id="front">Front view</button></nav><small>This is a motion review. Facial expressions are not included yet. The file stays in your browser.</small></main><script type="module">
import '@google/model-viewer';
const m=document.querySelector('#emma'),status=document.querySelector('#status'),idle=document.querySelector('#idle'),wave=document.querySelector('#wave'),pause=document.querySelector('#pause');let url,idleName,waveName;
document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith('.glb')){status.textContent='Please choose a GLB model.';return}m.pause();for(const b of [idle,wave,pause])b.disabled=true;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);status.textContent='Loading Emma…';m.src=url};
async function play(name,once=false){m.pause();m.animationName=name;await m.updateComplete;m.currentTime=0;m.play(once?{repetitions:1}:{});pause.textContent='Pause';status.textContent=once?'Emma is waving hello.':'Emma is gently idling.'}
m.addEventListener('load',()=>{idleName=m.availableAnimations.find(n=>/idle/i.test(n));waveName=m.availableAnimations.find(n=>/wave/i.test(n));idle.disabled=!idleName;wave.disabled=!waveName;pause.disabled=!m.availableAnimations.length;if(idleName)play(idleName);else status.textContent='Model loaded. No idle animation found.'});
m.addEventListener('error',()=>{status.textContent='Could not load this model. Choose the GLB again or try another browser.'});
m.addEventListener('finished',()=>{if(m.animationName===waveName&&idleName)play(idleName)});
idle.onclick=()=>play(idleName);wave.onclick=()=>play(waveName,true);pause.onclick=()=>{if(m.paused){m.play();pause.textContent='Pause'}else{m.pause();pause.textContent='Resume'}};document.querySelector('#front').onclick=()=>{m.cameraOrbit='0deg 75deg auto';m.jumpCameraToGoal()};
</script></html>
